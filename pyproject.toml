[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "invoice-auditor"
version = "0.1.0"
description = "Auditor de faturas logisticas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2.0",
    "argon2-cffi>=25.1,<26.0",
    "defusedxml>=0.7.1,<1.0",
    "fastapi>=0.116,<1.0",
    "pymupdf>=1.26,<2.0",
    "openpyxl>=3.1.5,<4.0",
    "openai>=3.1,<4.0",
    "pillow>=12.0,<13.0",
    "pydantic-settings>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pypdf>=6.0,<7.0",
    "sqlalchemy>=2.0.41,<3.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.35,<1.0",
    "xlrd>=2.0.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.16,<2.0",
    "pytest>=8.4,<10.0",
    "ruff>=0.12,<1.0",
    "xlwt>=1.3,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true
